# Docker Compose configuration for APODS AI-Automation Suite
# Base configuration - extend with docker-compose.dev.yml or docker-compose.prod.yml

version: '3.9'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16-alpine
    container_name: apods-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-apods}
      POSTGRES_USER: ${POSTGRES_USER:-apods}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-apods_password}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./docker/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    ports:
      - '${POSTGRES_PORT:-5432}:5432'
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U ${POSTGRES_USER:-apods}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - apods-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: apods-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD:-redis_password} --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis-data:/data
    ports:
      - '${REDIS_PORT:-6379}:6379'
    healthcheck:
      test: ['CMD', 'redis-cli', '--raw', 'incr', 'ping']
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 5s
    networks:
      - apods-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

  # Backend API
  backend:
    build:
      context: .
      dockerfile: apps/backend/Dockerfile
      args:
        NODE_ENV: ${NODE_ENV:-production}
    container_name: apods-backend
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      NODE_ENV: ${NODE_ENV:-production}
      PORT: 3000
      DATABASE_URL: postgresql://${POSTGRES_USER:-apods}:${POSTGRES_PASSWORD:-apods_password}@postgres:5432/${POSTGRES_DB:-apods}
      REDIS_URL: redis://:${REDIS_PASSWORD:-redis_password}@redis:6379
      JWT_SECRET: ${JWT_SECRET:-change_this_in_production}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY}
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost:80}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-15}
      RATE_LIMIT_MAX: ${RATE_LIMIT_MAX:-100}
    volumes:
      - backend-logs:/app/logs
      - backend-uploads:/app/uploads
    ports:
      - '${BACKEND_PORT:-3000}:3000'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:3000/health']
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s
    networks:
      - apods-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '5'
    deploy:
      resources:
        limits:
          cpus: '2'
          memory: 2G
        reservations:
          cpus: '0.5'
          memory: 512M

  # Frontend Application
  frontend:
    build:
      context: .
      dockerfile: apps/frontend/Dockerfile
      args:
        VITE_API_URL: ${VITE_API_URL:-http://localhost:3000}
        VITE_WS_URL: ${VITE_WS_URL:-ws://localhost:3000}
        VITE_APP_VERSION: ${VITE_APP_VERSION:-1.0.0}
    container_name: apods-frontend
    restart: unless-stopped
    depends_on:
      - backend
    volumes:
      - frontend-logs:/var/log/nginx
    ports:
      - '${FRONTEND_PORT:-80}:80'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/health.html']
      interval: 30s
      timeout: 3s
      retries: 3
      start_period: 5s
    networks:
      - apods-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'
    deploy:
      resources:
        limits:
          cpus: '1'
          memory: 512M
        reservations:
          cpus: '0.25'
          memory: 128M

  # Nginx Reverse Proxy (optional, for production-like setup)
  nginx:
    image: nginx:1.25-alpine
    container_name: apods-nginx
    restart: unless-stopped
    depends_on:
      - frontend
      - backend
    volumes:
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/ssl:/etc/nginx/ssl:ro
      - nginx-logs:/var/log/nginx
    ports:
      - '${NGINX_HTTP_PORT:-8080}:80'
      - '${NGINX_HTTPS_PORT:-8443}:443'
    healthcheck:
      test: ['CMD', 'curl', '-f', 'http://localhost:80/health']
      interval: 30s
      timeout: 3s
      retries: 3
    networks:
      - apods-network
    logging:
      driver: json-file
      options:
        max-size: '10m'
        max-file: '3'

networks:
  apods-network:
    driver: bridge
    ipam:
      config:
        - subnet: 172.28.0.0/16

volumes:
  postgres-data:
    driver: local
  redis-data:
    driver: local
  backend-logs:
    driver: local
  backend-uploads:
    driver: local
  frontend-logs:
    driver: local
  nginx-logs:
    driver: local
