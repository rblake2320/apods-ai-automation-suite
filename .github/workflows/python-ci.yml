name: Python CI

on:
  push:
    paths: ['**/*.py']
  pull_request:
    paths: ['**/*.py']

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
      - run: python -m pip install -r requirements.txt
      - run: python -m pytest
      - run: python -m flake8