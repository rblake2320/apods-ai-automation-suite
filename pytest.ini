[pytest]
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
addopts = 
    --verbose
    --color=yes
    --strict-markers
    --tb=short
    -ra
markers =
    asyncio: marks tests as async
    slow: marks tests as slow
    integration: marks tests as integration tests
asyncio_mode = auto
