# APODS AI-Automation Suite Configuration

# Application settings
app_name: 'APODS AI-Automation Suite'
app_version: '1.0.0'
environment: 'development'
debug: true

# Database configuration
database:
  url: 'sqlite:///apods.db'
  pool_size: 5
  max_overflow: 10
  pool_timeout: 30
  echo: false

# Network configuration
network:
  timeout: 30
  max_retries: 3
  backoff_factor: 2.0
  user_agent: 'APODS-Bot/1.0'
  verify_ssl: true

# Rate limiting
rate_limit:
  enabled: true
  calls: 100
  period: 60

# AI configuration
ai:
  api_key: null # Set via environment variable APODS_AI__API_KEY
  model: 'claude-3-5-sonnet-20241022'
  max_tokens: 4096
  temperature: 0.7
  timeout: 60

# Logging configuration
logging:
  level: 'INFO'
  format: '%(asctime)s - %(name)s - %(levelname)s - %(message)s'
  file_enabled: true
  file_path: 'logs/apods.log'
  console_enabled: true
  max_bytes: 10485760 # 10MB
  backup_count: 5

# Web scraping configuration
scraping:
  delay_min: 1.0
  delay_max: 3.0
  max_pages: 100
  respect_robots_txt: true
  concurrent_requests: 5

# Browser automation configuration
browser:
  headless: true
  viewport_width: 1920
  viewport_height: 1080
  timeout: 30000
  screenshot_enabled: false
  screenshot_path: 'screenshots/'

# Cache configuration
cache:
  enabled: true
  ttl: 3600
  max_size: 1000
  backend: 'memory'

# Paths
data_dir: 'data'
output_dir: 'output'
temp_dir: '/tmp/apods'
