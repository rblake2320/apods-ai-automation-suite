apiVersion: v1
kind: ConfigMap
metadata:
  name: apods-config
  namespace: apods
  labels:
    app: apods
data:
  # Node environment
  NODE_ENV: 'production'

  # Frontend configuration
  VITE_API_URL: 'https://api.apods.example.com'
  VITE_WS_URL: 'wss://api.apods.example.com'
  VITE_APP_VERSION: '1.0.0'

  # Backend configuration
  PORT: '3000'
  HOST: '0.0.0.0'
  LOG_LEVEL: 'info'

  # CORS
  CORS_ORIGIN: 'https://apods.example.com'
  CORS_CREDENTIALS: 'true'

  # Rate limiting
  RATE_LIMIT_WINDOW: '15'
  RATE_LIMIT_MAX: '100'

  # Features
  ENABLE_WEBSOCKETS: 'true'
  ENABLE_METRICS: 'true'
  ENABLE_CACHING: 'true'

  # Database
  POSTGRES_DB: 'apods'
  POSTGRES_USER: 'apods'

  # Redis
  REDIS_HOST: 'apods-redis'
  REDIS_PORT: '6379'
