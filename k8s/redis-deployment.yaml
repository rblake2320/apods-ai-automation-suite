apiVersion: apps/v1
kind: Deployment
metadata:
  name: apods-redis
  namespace: apods
  labels:
    app: apods
    component: redis
spec:
  replicas: 1
  selector:
    matchLabels:
      app: apods
      component: redis
  template:
    metadata:
      labels:
        app: apods
        component: redis
    spec:
      containers:
        - name: redis
          image: redis:7-alpine
          ports:
            - name: redis
              containerPort: 6379
              protocol: TCP
          command:
            - redis-server
            - --requirepass
            - $(REDIS_PASSWORD)
            - --maxmemory
            - 512mb
            - --maxmemory-policy
            - allkeys-lru
            - --save
            - '900 1'
            - --save
            - '300 10'
            - --appendonly
            - 'yes'
          env:
            - name: REDIS_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: apods-secrets
                  key: REDIS_PASSWORD
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 500m
              memory: 768Mi
          livenessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - redis-cli
                - ping
            initialDelaySeconds: 5
            periodSeconds: 5
          volumeMounts:
            - name: redis-data
              mountPath: /data
      volumes:
        - name: redis-data
          persistentVolumeClaim:
            claimName: apods-redis-data
---
apiVersion: v1
kind: Service
metadata:
  name: apods-redis
  namespace: apods
  labels:
    app: apods
    component: redis
spec:
  type: ClusterIP
  ports:
    - port: 6379
      targetPort: redis
      protocol: TCP
      name: redis
  selector:
    app: apods
    component: redis
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: apods-redis-data
  namespace: apods
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 5Gi
  storageClassName: standard
