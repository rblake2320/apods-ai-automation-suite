apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: apods-ingress
  namespace: apods
  labels:
    app: apods
  annotations:
    # Nginx ingress annotations
    kubernetes.io/ingress.class: nginx
    cert-manager.io/cluster-issuer: letsencrypt-prod
    nginx.ingress.kubernetes.io/ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/force-ssl-redirect: 'true'
    nginx.ingress.kubernetes.io/proxy-body-size: '50m'
    nginx.ingress.kubernetes.io/proxy-read-timeout: '300'
    nginx.ingress.kubernetes.io/proxy-send-timeout: '300'
    nginx.ingress.kubernetes.io/enable-cors: 'true'
    nginx.ingress.kubernetes.io/cors-allow-origin: 'https://apods.example.com'
    nginx.ingress.kubernetes.io/rate-limit: '100'

    # Security headers
    nginx.ingress.kubernetes.io/configuration-snippet: |
      more_set_headers "X-Frame-Options: SAMEORIGIN";
      more_set_headers "X-Content-Type-Options: nosniff";
      more_set_headers "X-XSS-Protection: 1; mode=block";
      more_set_headers "Referrer-Policy: no-referrer-when-downgrade";
      more_set_headers "Strict-Transport-Security: max-age=31536000; includeSubDomains";
spec:
  tls:
    - hosts:
        - apods.example.com
        - api.apods.example.com
      secretName: apods-tls
  rules:
    # Frontend
    - host: apods.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apods-frontend
                port:
                  number: 80

    # Backend API
    - host: api.apods.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: apods-backend
                port:
                  number: 3000
---
# ClusterIssuer for Let's Encrypt (cert-manager required)
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: letsencrypt-prod
spec:
  acme:
    server: https://acme-v02.api.letsencrypt.org/directory
    email: admin@apods.example.com
    privateKeySecretRef:
      name: letsencrypt-prod
    solvers:
      - http01:
          ingress:
            class: nginx
