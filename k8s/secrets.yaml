# This is a template file. In production, use sealed secrets or external secret management
# Create actual secrets with: kubectl create secret generic apods-secrets --from-literal=...

apiVersion: v1
kind: Secret
metadata:
  name: apods-secrets
  namespace: apods
  labels:
    app: apods
type: Opaque
stringData:
  # JWT secrets (replace with actual secure values)
  JWT_SECRET: 'REPLACE_WITH_SECURE_JWT_SECRET_AT_LEAST_32_CHARACTERS'
  JWT_REFRESH_SECRET: 'REPLACE_WITH_SECURE_REFRESH_SECRET_AT_LEAST_32_CHARACTERS'

  # Session secret
  SESSION_SECRET: 'REPLACE_WITH_SECURE_SESSION_SECRET_AT_LEAST_32_CHARACTERS'

  # Encryption key
  ENCRYPTION_KEY: 'REPLACE_WITH_32_CHARACTER_KEY'

  # Database credentials
  POSTGRES_PASSWORD: 'REPLACE_WITH_SECURE_DATABASE_PASSWORD'
  DATABASE_URL: 'postgresql://apods:REPLACE_WITH_PASSWORD@apods-postgres:5432/apods'

  # Redis password
  REDIS_PASSWORD: 'REPLACE_WITH_SECURE_REDIS_PASSWORD'
  REDIS_URL: 'redis://:REPLACE_WITH_PASSWORD@apods-redis:6379'

  # Anthropic API key
  ANTHROPIC_API_KEY: 'REPLACE_WITH_ANTHROPIC_API_KEY'

  # Email credentials
  EMAIL_USER: 'REPLACE_WITH_EMAIL_USER'
  EMAIL_PASSWORD: 'REPLACE_WITH_EMAIL_PASSWORD'

  # AWS credentials (if used)
  AWS_ACCESS_KEY_ID: 'REPLACE_WITH_AWS_ACCESS_KEY'
  AWS_SECRET_ACCESS_KEY: 'REPLACE_WITH_AWS_SECRET_KEY'

  # Sentry DSN (if used)
  SENTRY_DSN: 'REPLACE_WITH_SENTRY_DSN'
